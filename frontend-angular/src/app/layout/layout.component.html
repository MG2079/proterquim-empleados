<div class="layout">

  <!-- 🔵 HEADER -->

  <div class="header">

    <!-- 🧩 LOGO -->

    <div class="logo">

      <img
        src="assets/logo.png"
        alt="logo"
      >

      <span>
        Proterquim S.A.S
      </span>

    </div>

    <!-- 🔍 TOP BAR -->

    <div class="top-bar">

      <input
        type="text"
        placeholder="Buscar..."
        (input)="buscar($event)"
      />

      <!-- 👤 USUARIO -->

      <span class="admin-user">

        {{ usuario?.nombre }}

        -

        {{ rol }}

      </span>

    </div>

  </div>

  <!-- 📦 MAIN -->

  <div class="main">

    <!-- 🧭 SIDEBAR -->

    <div class="sidebar">

      <!-- 📊 DASHBOARD -->

      <div
        class="menu-item"
        routerLink="/dashboard"
        routerLinkActive="activo"
      >
        Panel de Control
      </div>

      <!-- 📦 PRODUCTOS -->

      <div

        *ngIf="
          esAdmin() ||
          esGerente()
        "

        class="menu-item"

        routerLink="/productos"

        routerLinkActive="activo"
      >

        Gestión de Productos

      </div>

      <!-- 🛒 PEDIDOS -->

      <div

        *ngIf="
          esAdmin() ||
          esGerente() ||
          esContador()
        "

        class="menu-item"

        routerLink="/pedidos"

        routerLinkActive="activo"
      >

        Gestión de Pedidos

      </div>

      <!-- 📦 INVENTARIOS -->

      <div

        *ngIf="
          esAdmin() ||
          esGerente() ||
          esEmpleado()
        "

        class="menu-item"

        routerLink="/inventarios"

        routerLinkActive="activo"
      >

        Gestión de Inventarios

      </div>

      <!-- 📈 REPORTES -->

      <div

        *ngIf="
          esAdmin() ||
          esContador()
        "

        class="menu-item"

        routerLink="/reportes"

        routerLinkActive="activo"
      >

        Reportes y Estadísticas

      </div>

      <!-- 👨‍💼 EMPLEADOS -->

      <div

        *ngIf="
          esAdmin()
        "

        class="menu-item"

        routerLink="/empleados"

        routerLinkActive="activo"
      >

        Gestión de Empleados

      </div>

      <!-- 🔐 LOGOUT -->

      <div class="logout-bottom">

        <button (click)="logout()">

          Cerrar sesión

        </button>

      </div>

    </div>

    <!-- 📄 CONTENIDO -->

    <div class="content">

      <router-outlet></router-outlet>

    </div>

  </div>

</div>
