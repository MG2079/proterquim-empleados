<div class="container">

  <!-- 🔵 BARRA SUPERIOR -->
  <div class="header">

    <div class="logo-container">

      <img
        src="assets/logo.png"
        class="logo"
        alt="Logo Proterquim"
      />

      <h1>Proterquim</h1>

    </div>

  </div>

  <!-- 🧾 LOGIN -->
  <div class="login-box">

    <h2>Inicio de Sesión</h2>

    <!-- 🔴 MENSAJE -->
    <p
      *ngIf="mensajeError"
      [ngClass]="'mensaje ' + tipoMensaje"
      role="alert"
    >
      {{ mensajeError }}
    </p>

    <!-- 👤 EMAIL -->
    <div class="input-container">

      <!-- 📧 ICONO -->
      <span class="material-symbols-outlined input-icon">
        mail
      </span>

      <!-- INPUT -->
      <input
        type="text"
        name="usuario"
        placeholder="Correo electrónico"
        [(ngModel)]="usuario"
        autocomplete="username"
        (keyup.enter)="login()"
      />

    </div>

    <!-- 🔒 PASSWORD -->
    <div class="password-container">

      <!-- 🔐 ICONO -->
      <span class="material-symbols-outlined input-icon">
        lock
      </span>

      <!-- INPUT -->
      <input
        [type]="verPassword ? 'text' : 'password'"
        name="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
        autocomplete="current-password"
        (keyup.enter)="login()"
      />

      <!-- 👁️ MOSTRAR / OCULTAR -->
      <span
        class="material-symbols-outlined eye"
        (click)="togglePassword()"
        [attr.aria-label]="
          verPassword
            ? 'Ocultar contraseña'
            : 'Mostrar contraseña'
        "
        role="button"
        tabindex="0"
        (keyup.enter)="togglePassword()"
      >
        {{
          verPassword
            ? 'visibility_off'
            : 'visibility'
        }}
      </span>

    </div>

    <!-- 🔘 BOTÓN -->
    <button
      (click)="login()"
      [disabled]="cargando"
      [attr.aria-busy]="cargando"
    >

      {{
        cargando
          ? 'Ingresando...'
          : 'Iniciar sesión'
      }}

    </button>

    <!-- 🔁 RECUPERAR -->
    <p
      class="forgot"
      (click)="recuperar()"
    >
      ¿Olvidó su contraseña?
    </p>

  </div>

</div>
