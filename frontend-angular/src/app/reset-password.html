
<div class="reset-page">
  <header class="reset-header">
    <div class="logo-container">
      <img
        src="assets/logo.png"
        alt="Logo de Proterquim"
        class="logo"
        onerror="this.style.display='none'"
      />
    </div>
    <h1>Proterquim S.A.S.</h1>
  </header>

  <main class="reset-main">
    <section class="reset-card">
      <div class="reset-icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="42"
          height="42"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          <path d="M12 15v2"></path>
        </svg>
      </div>

      <h2>Restablecer contraseña</h2>

      <p class="reset-description">
        Crea una nueva contraseña para acceder de forma segura a
        ProterquimERP.
      </p>

      <div
        *ngIf="mensaje"
        class="message"
        [ngClass]="{
          'message-success': tipoMensaje === 'success',
          'message-error': tipoMensaje === 'error'
        }"
        role="status"
        aria-live="polite"
      >
        {{ mensaje }}
      </div>

      <form
        *ngIf="!completado && token"
        (ngSubmit)="restablecer()"
        #resetForm="ngForm"
      >
        <div class="form-group">
          <label for="password">Nueva contraseña</label>

          <div class="password-wrapper">
            <input
              id="password"
              name="password"
              [type]="verPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="Mínimo 8 caracteres"
              minlength="8"
              autocomplete="new-password"
              required
              [disabled]="cargando"
            />

            <button
              type="button"
              class="toggle-password"
              (click)="verPassword = !verPassword"
              [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              {{ verPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmarPassword">
            Confirmar nueva contraseña
          </label>

          <div class="password-wrapper">
            <input
              id="confirmarPassword"
              name="confirmarPassword"
              [type]="verConfirmacion ? 'text' : 'password'"
              [(ngModel)]="confirmarPassword"
              placeholder="Repite la nueva contraseña"
              autocomplete="new-password"
              required
              [disabled]="cargando"
            />

            <button
              type="button"
              class="toggle-password"
              (click)="verConfirmacion = !verConfirmacion"
              [attr.aria-label]="verConfirmacion ? 'Ocultar confirmación' : 'Mostrar confirmación'"
            >
              {{ verConfirmacion ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="submit-button"
          [disabled]="cargando || !resetForm.valid"
        >
          <span *ngIf="!cargando">Guardar nueva contraseña</span>
          <span *ngIf="cargando">Procesando...</span>
        </button>
      </form>

      <button
        *ngIf="completado"
        type="button"
        class="submit-button"
        (click)="irAlLogin()"
      >
        Ir al inicio de sesión
      </button>

      <button
        *ngIf="!token && !completado"
        type="button"
        class="back-button"
        (click)="irAlLogin()"
      >
        Volver al inicio de sesión
      </button>

      <p class="security-note">
        Por seguridad, el enlace de recuperación es temporal y solo
        puede utilizarse una vez.
      </p>
    </section>
  </main>

  <footer class="reset-footer">
    Proterquim S.A.S. · Sistema de Inventarios y Pedidos
  </footer>
</div>
